<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161619" />
    <title>Shabii's Gallery</title>
    <link rel="icon" href="assets/icon-v58.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/app-icon-v58.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <header class="topbar">
        <a class="brand" href="https://moxfield.com/users/Shabii" target="_blank" rel="noreferrer" aria-label="Open Shabii on Moxfield">
          <span class="brand-mark"><img src="assets/icon-v58.png" alt=""></span>
          <span>
            <strong>Shabii's Gallery</strong>
          </span>
        </a>
        <nav class="top-actions" aria-label="Primary actions">
          <button class="icon-button" id="settingsButton" type="button" title="Settings" aria-label="Settings" hidden>
            <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.8 3.7h4.4l.42 2.1c.45.16.87.4 1.25.7l2.02-.68 2.2 3.82-1.6 1.42c.04.31.04.57 0 .88l1.6 1.42-2.2 3.82-2.02-.68c-.38.3-.8.54-1.25.7l-.42 2.1H9.8l-.42-2.1a5.3 5.3 0 0 1-1.25-.7l-2.02.68-2.2-3.82 1.6-1.42a4.1 4.1 0 0 1 0-.88l-1.6-1.42 2.2-3.82 2.02.68c.38-.3.8-.54 1.25-.7l.42-2.1Z"></path>
              <circle cx="12" cy="12" r="2.65"></circle>
            </svg>
          </button>
          <button class="ghost-button icon-only-button" id="loginButton" type="button" title="Log in" aria-label="Log in"></button>
          <a class="ghost-button icon-only-button moxfield-button" href="https://moxfield.com/users/Shabii" target="_blank" rel="noreferrer" title="Moxfield" aria-label="Open Shabii on Moxfield">
            <img src="assets/moxfield.png" alt="" aria-hidden="true">
          </a>
          <button class="primary-button" id="addCardButton" type="button" hidden>
            <span class="button-label" data-i18n="add_card">Add card</span>
            <span class="button-icon" aria-hidden="true">
              <svg class="plus-icon" viewBox="0 0 24 24">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </span>
          </button>
        </nav>
    </header>

    <main class="page-shell">
        <section class="module latest-module" data-module="latest">
          <button class="latest-toggle" id="latestToggle" type="button" aria-expanded="true" aria-controls="latestAdditions">
            <span>Latest additions</span>
            <svg class="latest-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          <div class="latest-strip" id="latestAdditions" aria-label="Last additions"></div>
        </section>
        <section class="module" data-module="gallery">
          <button class="filter-toggle-button" id="filterToggleButton" type="button" aria-expanded="false" aria-controls="filterForm">
            <span class="filter-toggle-copy">
              <svg class="filter-toggle-search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5"></circle>
                <path d="m16 16 4 4"></path>
              </svg>
              <span>Search & Filter</span>
            </span>
            <svg class="filter-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          <form class="toolbar" id="filterForm">
            <div class="type-filter-row">
              <label>
                <span data-i18n="type">Type</span>
                <select id="typeFilter"></select>
              </label>
              <label class="foil-filter-toggle" title="Foil only" aria-label="Foil only">
                <input id="foilFilter" type="checkbox" />
                <span aria-hidden="true">
                  <img src="assets/glow.svg" alt="">
                </span>
              </label>
            </div>
            <label>
              <span data-i18n="artist">Artist</span>
              <select id="artistFilter"></select>
            </label>
            <label>
              <span data-i18n="set">Set</span>
              <select id="setFilter"></select>
            </label>
            <div class="sort-action-row">
              <label>
                <span>Sort</span>
                <select id="sortSelect">
                  <option value="artist">Artist</option>
                  <option value="deck">Deck</option>
                  <option value="name">Name</option>
                  <option value="year">Year</option>
                  <option value="type">Type</option>
                </select>
              </label>
              <button class="ghost-button icon-only-button sort-direction-button" id="sortDirectionButton" type="button" title="Sort direction" aria-label="Sort direction" data-direction="asc">
                <svg class="sort-direction-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14"></path>
                  <path d="M6.5 10.5 12 5l5.5 5.5"></path>
                </svg>
              </button>
              <label class="separator-icon-toggle" title="Separators" aria-label="Show separators">
                <input id="separatorToggle" type="checkbox" />
                <span aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="2" y="5" width="5.5" height="14" rx="1.5"></rect>
                    <path d="M12 5v14"></path>
                    <rect x="16.5" y="5" width="5.5" height="14" rx="1.5"></rect>
                  </svg>
                </span>
              </label>
              <label class="bundle-icon-toggle" title="Bundle" aria-label="Bundle same name">
                <input id="bundleToggle" type="checkbox" />
                <span aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="8.5" y="1.5" width="11" height="15" rx="2"></rect>
                    <path d="M4.5 6.5v12a2 2 0 0 0 2 2h8"></path>
                  </svg>
                </span>
              </label>
            </div>
            <div class="gallery-scale-controls" aria-label="Gallery layout">
              <label>
                <span>Display</span>
                <input id="cardScaleRange" type="range" min="2" max="7" step="1" />
              </label>
            </div>
          </form>

          <div class="gallery-summary" id="resultCount"></div>
          <div class="gallery-grid" id="galleryGrid" aria-live="polite"></div>
        </section>
    </main>

    <footer class="site-footer">
      <span class="footer-meta-line">
        <span id="lastEditText">Last edit 11 September</span>
        <span aria-hidden="true">·</span>
        <button id="clearCacheButton" type="button" title="Clear cache and reload">v50.09.12</button>
      </span>
      <span class="footer-separator" aria-hidden="true">·</span>
      <a class="footer-credit" href="https://x.com/Shabii_exe" target="_blank" rel="noreferrer"><b>Gallery by Shabii</b><img src="assets/shabii_logo.png" alt=""></a>
    </footer>

    <dialog class="modal" id="loginDialog">
      <form method="dialog" class="modal-card compact" id="loginForm">
        <div class="modal-head">
          <h2 data-i18n="login">Log in</h2>
          <button class="icon-button" value="cancel" aria-label="Close" type="submit" formnovalidate>
            <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.5 6.5l11 11"></path>
              <path d="M17.5 6.5l-11 11"></path>
            </svg>
          </button>
        </div>
        <label>
          <span data-i18n="password">Password</span>
          <input id="passwordInput" type="password" autocomplete="current-password" />
        </label>
        <p class="form-message" id="loginMessage"></p>
        <div class="modal-actions">
          <button class="ghost-button" value="cancel" type="submit" formnovalidate data-i18n="cancel">Cancel</button>
          <button class="primary-button" id="submitLogin" type="button" data-i18n="login">Log in</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="settingsDialog">
      <form method="dialog" class="modal-card" id="settingsForm">
        <div class="modal-head">
          <h2 data-i18n="settings">Settings</h2>
          <button class="icon-button" value="cancel" aria-label="Close" type="submit">
            <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.5 6.5l11 11"></path>
              <path d="M17.5 6.5l-11 11"></path>
            </svg>
          </button>
        </div>
        <div class="settings-grid">
          <label>
            <span data-i18n="language">Language</span>
            <select id="languageSelect">
              <option value="en">English</option>
              <option value="es">Español</option>
            </select>
          </label>
          <label>
            <span>Default sort</span>
            <select id="defaultSortSelect">
              <option value="artist">Artist</option>
              <option value="deck">Deck</option>
              <option value="name">Name</option>
              <option value="year">Year</option>
              <option value="type">Type</option>
            </select>
          </label>
          <label>
            <span>Default direction</span>
            <select id="defaultSortDirectionSelect">
              <option value="asc">Up</option>
              <option value="desc">Down</option>
            </select>
          </label>
          <label>
            <span>Mobile display</span>
            <select id="defaultMobileDisplaySelect">
              <option value="1">1 card</option>
              <option value="2">2 cards</option>
              <option value="3">3 cards</option>
            </select>
          </label>
          <label>
            <span>Desktop display</span>
            <select id="defaultDesktopDisplaySelect">
              <option value="2">2 cards</option>
              <option value="3">3 cards</option>
              <option value="4">4 cards</option>
              <option value="5">5 cards</option>
              <option value="6">6 cards</option>
              <option value="7">7 cards</option>
            </select>
          </label>
          <section class="module-order">
            <h3 data-i18n="modules">Modules</h3>
            <div id="moduleSettings"></div>
          </section>
        </div>
        <div class="modal-actions">
          <button class="ghost-button" value="cancel" type="submit" data-i18n="cancel">Cancel</button>
          <button class="primary-button" id="saveSettings" type="button" data-i18n="save">Save</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="cardDialog">
      <article class="modal-card detail-card" id="cardDetail"></article>
    </dialog>

    <dialog class="modal" id="editDialog">
      <form method="dialog" class="modal-card edit-card" id="cardForm">
        <div class="modal-head">
          <h2 id="editTitle" data-i18n="add_card">Add card</h2>
          <div class="modal-head-actions">
            <button class="primary-button" type="button" data-save-card data-i18n="save">Save</button>
            <button class="icon-button" value="cancel" aria-label="Close" type="button" data-close-edit formnovalidate>
              <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.5 6.5l11 11"></path>
                <path d="M17.5 6.5l-11 11"></path>
              </svg>
            </button>
          </div>
        </div>
        <input type="hidden" id="editingId" />
        <div class="lookup-panel">
          <label>
            <span data-i18n="find_card">Find card</span>
            <input id="lookupInput" type="search" placeholder="Card name, Scryfall link, Cardmarket or TCGplayer link" />
          </label>
          <button class="ghost-button icon-only-button" id="lookupButton" type="button" title="Search" aria-label="Search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
          </button>
        </div>
        <div class="lookup-results" id="lookupResults"></div>
        <div class="form-grid">
          <label>
            <span data-i18n="card_name">Card name</span>
            <input id="cardName" required />
          </label>
          <label class="check-filter partner-check">
            <input id="partnerInput" type="checkbox" />
            <span>Partner</span>
          </label>
          <label id="partnerSelectField" hidden>
            <span>Partner card</span>
            <select id="partnerSelect"></select>
          </label>
          <div class="form-row-three wide">
            <label>
              <span data-i18n="kind">Kind</span>
              <select id="cardKind"></select>
            </label>
            <label>
              <span data-i18n="language">Language</span>
              <select id="cardLanguage"></select>
            </label>
            <label class="check-filter stars-check">
              <input id="foilInput" type="checkbox" />
              <span data-i18n="foil">Foil</span>
            </label>
          </div>
          <label>
            <span data-i18n="front_photo">Front photo</span>
            <input id="frontPhoto" type="file" accept="image/*" />
          </label>
          <label>
            <span>Pick front</span>
            <select id="frontAssetSelect"></select>
            <span class="asset-select-preview" id="frontAssetPreview" hidden>
              <img alt="">
            </span>
          </label>
          <label>
            <span data-i18n="back_photo">Back photo</span>
            <input id="backPhoto" type="file" accept="image/*" />
          </label>
          <label>
            <span>Pick back</span>
            <select id="backAssetSelect"></select>
            <span class="asset-select-preview" id="backAssetPreview" hidden>
              <img alt="">
            </span>
          </label>
          <label>
            <span id="artistLabel" data-i18n="artist">Artist</span>
            <input id="collectorArtist" />
          </label>
          <label>
            <span>Artist social link</span>
            <span class="input-with-favicon">
              <img id="artistSocialFavicon" alt="" hidden>
              <input id="artistSocialInput" type="url" placeholder="https://instagram.com/artist" />
            </span>
          </label>
          <label>
            <span data-i18n="year">Year</span>
            <input id="signatureYear" type="number" min="1993" max="2100" />
          </label>
          <label>
            <span data-i18n="where_how">Where/How</span>
            <input id="signaturePlace" />
          </label>
          <label class="wide">
            <span data-i18n="description">Description</span>
            <textarea id="descriptionInput" rows="3"></textarea>
          </label>
        </div>
        <section class="form-section actual-info card-info-section">
          <h3>Card Info</h3>
          <div class="info-grid">
            <label><span data-i18n="set">Set</span><input id="setNameInput" /></label>
            <label><span data-i18n="set_code">Set code</span><span class="input-with-set-icon"><img id="setCodeIcon" alt=""><input id="setCodeInput" /></span></label>
            <label><span data-i18n="number">Number</span><input id="collectorNumberInput" /></label>
            <label><span data-i18n="set_year">Set year</span><input id="setYearInput" type="number" /></label>
            <label><span data-i18n="card_artist">Card artist</span><input id="cardArtistInput" /></label>
            <label><span data-i18n="scryfall">Scryfall</span><input id="scryfallInput" /></label>
          </div>
        </section>
        <section class="form-section actual-info moxfield-info-section">
          <h3>Moxfield Deck information</h3>
          <div class="moxfield-field">
            <span>Moxfield deck URL</span>
            <div class="inline-fetch">
              <input id="moxfieldInput" />
              <button class="ghost-button" id="fetchDeckButton" type="button">
                <span class="button-label" data-i18n="fetch_deck">Fetch</span>
                <span class="button-icon" aria-hidden="true">
                  <svg class="download-icon" viewBox="0 0 24 24">
                    <path d="M12 2.5v13.5"></path>
                    <path d="M6.5 10.5l5.5 5.5 5.5-5.5"></path>
                    <path d="M4.5 20.5h15"></path>
                  </svg>
                </span>
              </button>
            </div>
          </div>
          <div class="info-grid">
            <label>
              <span data-i18n="deck_name">Deck name</span>
              <input id="deckNameInput" />
            </label>
            <label>
              <span data-i18n="format">Format</span>
              <input id="deckFormatInput" />
            </label>
            <label>
              <span data-i18n="bracket">Bracket</span>
              <input id="deckBracketInput" />
            </label>
            <label>
              <span data-i18n="deck_owner">Deck owner</span>
              <input id="deckOwnerInput" />
            </label>
          </div>
          <div class="wide deck-owners-editor" id="deckOwnersEditor"></div>
          <div class="commander-role-field" id="commanderRoleField" hidden>
            <label class="check-filter">
              <input id="deckCommanderInput" type="checkbox" />
              <span>Commander</span>
            </label>
            <label class="check-filter">
              <input id="deckTokenInput" type="checkbox" />
              <span>Token</span>
            </label>
          </div>
        </section>
        <p class="form-message" id="cardFormMessage"></p>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button class="danger-button icon-only-button" id="deleteCardButton" type="button" title="Delete" aria-label="Delete">
            <svg class="trash-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v5"></path>
              <path d="M14 11v5"></path>
            </svg>
          </button>
          <button class="primary-button" id="saveCardButton" type="button" data-save-card data-i18n="save">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
