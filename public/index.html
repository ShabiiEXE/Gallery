<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161619" />
    <title>Shabii's Gallery</title>
    <link rel="icon" href="assets/Icon.png" type="image/png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <header class="topbar">
        <a class="brand" href="/" aria-label="Shabii's Gallery home">
          <span class="brand-mark"><img src="assets/Icon.png" alt=""></span>
          <span>
            <strong>Shabii's Gallery</strong>
            <small data-i18n="tagline">Signed cards, proofs, alters and proxies</small>
          </span>
        </a>
        <nav class="top-actions" aria-label="Primary actions">
          <button class="icon-button" id="settingsButton" type="button" title="Settings" aria-label="Settings">
            <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.8 3.7h4.4l.42 2.1c.45.16.87.4 1.25.7l2.02-.68 2.2 3.82-1.6 1.42c.04.31.04.57 0 .88l1.6 1.42-2.2 3.82-2.02-.68c-.38.3-.8.54-1.25.7l-.42 2.1H9.8l-.42-2.1a5.3 5.3 0 0 1-1.25-.7l-2.02.68-2.2-3.82 1.6-1.42a4.1 4.1 0 0 1 0-.88l-1.6-1.42 2.2-3.82 2.02.68c.38-.3.8-.54 1.25-.7l.42-2.1Z"></path>
              <circle cx="12" cy="12" r="2.65"></circle>
            </svg>
          </button>
          <button class="ghost-button" id="loginButton" type="button" data-i18n="login">Log in</button>
          <button class="primary-button" id="addCardButton" type="button">
            <span class="button-label" data-i18n="add_card">Add card</span>
            <span class="button-icon" aria-hidden="true">
              <svg class="plus-icon" viewBox="0 0 24 24">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </span>
          </button>
        </nav>
    </header>

    <main class="page-shell">
        <section class="module" data-module="gallery">
          <div class="module-head">
            <div>
            </div>
            <div class="module-count" id="resultCount"></div>
          </div>

          <form class="toolbar" id="filterForm">
            <label class="search-box">
              <span data-i18n="search">Search</span>
              <span class="input-with-icon">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="6.5"></circle>
                  <path d="m16 16 4 4"></path>
                </svg>
                <input id="searchInput" type="search" placeholder="Search by name, artist, set..." autocomplete="off" />
              </span>
            </label>
            <label>
              <span data-i18n="type">Type</span>
              <select id="typeFilter"></select>
            </label>
            <label>
              <span data-i18n="set">Set</span>
              <select id="setFilter"></select>
            </label>
            <label>
              <span data-i18n="artist">Artist</span>
              <select id="artistFilter"></select>
            </label>
            <label class="check-filter">
              <input id="bundleToggle" type="checkbox" />
              <span data-i18n="bundle">Bundle same name</span>
            </label>
          </form>

          <div class="gallery-grid" id="galleryGrid" aria-live="polite"></div>
          <div class="empty-state" id="emptyState" hidden>
            <button class="primary-button" type="button" data-open-add>
              <span class="button-label" data-i18n="add_card">Add card</span>
              <span class="button-icon" aria-hidden="true">
                <svg class="plus-icon" viewBox="0 0 24 24">
                  <path d="M12 5v14"></path>
                  <path d="M5 12h14"></path>
                </svg>
              </span>
            </button>
          </div>
        </section>
    </main>

    <footer class="site-footer">
      <button id="clearCacheButton" type="button" title="Clear cache and reload">Version 0.1.0</button>
    </footer>

    <dialog class="modal" id="loginDialog">
      <form method="dialog" class="modal-card compact" id="loginForm">
        <div class="modal-head">
          <h2 data-i18n="login">Log in</h2>
          <button class="icon-button" value="cancel" aria-label="Close" type="submit" formnovalidate>
            <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.5 6.5l11 11"></path>
              <path d="M17.5 6.5l-11 11"></path>
            </svg>
          </button>
        </div>
        <label>
          <span data-i18n="password">Password</span>
          <input id="passwordInput" type="password" autocomplete="current-password" />
        </label>
        <p class="form-message" id="loginMessage"></p>
        <div class="modal-actions">
          <button class="ghost-button" value="cancel" type="submit" formnovalidate data-i18n="cancel">Cancel</button>
          <button class="primary-button" id="submitLogin" type="button" data-i18n="login">Log in</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="settingsDialog">
      <form method="dialog" class="modal-card" id="settingsForm">
        <div class="modal-head">
          <h2 data-i18n="settings">Settings</h2>
          <button class="icon-button" value="cancel" aria-label="Close" type="submit">
            <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.5 6.5l11 11"></path>
              <path d="M17.5 6.5l-11 11"></path>
            </svg>
          </button>
        </div>
        <div class="settings-grid">
          <label>
            <span data-i18n="language">Language</span>
            <span class="select-with-flag">
              <img class="select-flag" id="settingsLanguageFlag" src="assets/flags/us.svg" alt="">
              <select id="languageSelect">
                <option value="en">English</option>
                <option value="es">Español</option>
              </select>
            </span>
          </label>
          <section class="module-order">
            <h3 data-i18n="modules">Modules</h3>
            <div id="moduleSettings"></div>
          </section>
        </div>
        <div class="modal-actions">
          <button class="ghost-button" value="cancel" type="submit" data-i18n="cancel">Cancel</button>
          <button class="primary-button" id="saveSettings" type="button" data-i18n="save">Save</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="cardDialog">
      <article class="modal-card detail-card" id="cardDetail"></article>
    </dialog>

    <dialog class="modal" id="editDialog">
      <form method="dialog" class="modal-card edit-card" id="cardForm">
        <div class="modal-head">
          <h2 id="editTitle" data-i18n="add_card">Add card</h2>
          <button class="icon-button" value="cancel" aria-label="Close" type="submit" formnovalidate>
            <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.5 6.5l11 11"></path>
              <path d="M17.5 6.5l-11 11"></path>
            </svg>
          </button>
        </div>
        <div class="lookup-panel">
          <label>
            <span data-i18n="find_card">Find card</span>
            <input id="lookupInput" type="search" placeholder="Card name, Scryfall link, Cardmarket or TCGplayer link" />
          </label>
          <button class="ghost-button icon-only-button" id="lookupButton" type="button" title="Search" aria-label="Search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
          </button>
        </div>
        <div class="lookup-results" id="lookupResults"></div>
        <input type="hidden" id="editingId" />
        <div class="form-grid">
          <label>
            <span data-i18n="card_name">Card name</span>
            <input id="cardName" required />
          </label>
          <label>
            <span data-i18n="kind">Kind</span>
            <select id="cardKind"></select>
          </label>
          <label>
            <span data-i18n="language">Language</span>
            <span class="select-with-flag">
              <img class="select-flag" id="cardLanguageFlag" src="assets/flags/us.svg" alt="">
              <select id="cardLanguage"></select>
            </span>
          </label>
          <label class="check-filter stars-check">
            <input id="foilInput" type="checkbox" />
            <span data-i18n="foil">Foil</span>
          </label>
          <label>
            <span data-i18n="front_photo">Front photo</span>
            <input id="frontPhoto" type="file" accept="image/*" />
          </label>
          <label>
            <span data-i18n="back_photo">Back photo</span>
            <input id="backPhoto" type="file" accept="image/*" />
          </label>
          <label>
            <span id="artistLabel" data-i18n="artist">Artist</span>
            <input id="collectorArtist" />
          </label>
          <label>
            <span>Artist social link</span>
            <input id="artistSocialInput" type="url" placeholder="https://instagram.com/artist" />
          </label>
          <label>
            <span data-i18n="year">Year</span>
            <input id="signatureYear" type="number" min="1993" max="2100" />
          </label>
          <label>
            <span data-i18n="where_how">Where/How</span>
            <input id="signaturePlace" />
          </label>
          <label class="wide">
            <span data-i18n="description">Description</span>
            <textarea id="descriptionInput" rows="3"></textarea>
          </label>
          <div class="wide moxfield-field">
            <span data-i18n="moxfield">Moxfield deck link</span>
            <div class="inline-fetch">
              <input id="moxfieldInput" />
              <button class="ghost-button" id="fetchDeckButton" type="button">
                <span class="button-label" data-i18n="fetch_deck">Fetch</span>
                <span class="button-icon" aria-hidden="true">
                  <svg class="download-icon" viewBox="0 0 24 24">
                    <path d="M12 2.5v13.5"></path>
                    <path d="M6.5 10.5l5.5 5.5 5.5-5.5"></path>
                    <path d="M4.5 20.5h15"></path>
                  </svg>
                </span>
              </button>
            </div>
          </div>
          <label>
            <span data-i18n="deck_name">Deck name</span>
            <input id="deckNameInput" />
          </label>
          <label>
            <span data-i18n="format">Format</span>
            <input id="deckFormatInput" />
          </label>
          <label>
            <span data-i18n="bracket">Bracket</span>
            <input id="deckBracketInput" />
          </label>
          <label>
            <span data-i18n="deck_owner">Deck owner</span>
            <input id="deckOwnerInput" />
          </label>
        </div>
        <section class="actual-info">
          <h3 data-i18n="actual_card_info">Actual card info</h3>
          <div class="info-grid">
            <label><span data-i18n="set">Set</span><input id="setNameInput" /></label>
            <label><span data-i18n="set_code">Set code</span><span class="input-with-set-icon"><img id="setCodeIcon" alt=""><input id="setCodeInput" /></span></label>
            <label><span data-i18n="number">Number</span><input id="collectorNumberInput" /></label>
            <label><span data-i18n="set_year">Set year</span><input id="setYearInput" type="number" /></label>
            <label><span data-i18n="card_artist">Card artist</span><input id="cardArtistInput" /></label>
            <label><span data-i18n="scryfall">Scryfall</span><input id="scryfallInput" /></label>
          </div>
        </section>
        <p class="form-message" id="cardFormMessage"></p>
        <div class="modal-actions">
          <button class="danger-button icon-only-button" id="deleteCardButton" type="button" title="Delete" aria-label="Delete">
            <svg class="trash-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v5"></path>
              <path d="M14 11v5"></path>
            </svg>
          </button>
          <span class="spacer"></span>
          <button class="ghost-button" value="cancel" type="submit" formnovalidate data-i18n="cancel">Cancel</button>
          <button class="primary-button" id="saveCardButton" type="button" data-i18n="save">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
